<style>

  --sans: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

<style>
/* Study road: a sketchbook overworld seen from above. One ink road, spaced by real days,
   a coral car the scroll drives, and the world sketching itself in as the camera passes. */
:root {
  --paper: oklch(0.972 0.013 88);
  --ink: oklch(0.27 0.02 55);
  --pencil: oklch(0.6 0.016 70);
  --wash: oklch(0.925 0.02 88);
  --leaf: oklch(0.9 0.055 132);
  --water: oklch(0.88 0.045 220);
  --car: oklch(0.66 0.17 36);
  --car-tint: oklch(0.93 0.045 40);
  --rain: oklch(0.6 0.13 245);
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: oklch(0.2 0.012 65); --ink: oklch(0.93 0.016 85); --pencil: oklch(0.6 0.014 75);
    --wash: oklch(0.255 0.014 70); --leaf: oklch(0.34 0.05 135); --water: oklch(0.33 0.045 230);
    --car: oklch(0.72 0.15 38); --car-tint: oklch(0.32 0.06 38); --rain: oklch(0.74 0.1 240);
  }
}
:root[data-theme="dark"] {
  --paper: oklch(0.2 0.012 65); --ink: oklch(0.93 0.016 85); --pencil: oklch(0.6 0.014 75);
  --wash: oklch(0.255 0.014 70); --leaf: oklch(0.34 0.05 135); --water: oklch(0.33 0.045 230);
  --car: oklch(0.72 0.15 38); --car-tint: oklch(0.32 0.06 38); --rain: oklch(0.74 0.1 240);
}


body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.journey { position: relative; color: var(--ink); }
.j-stage { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: hidden; touch-action: pan-y; }
.j-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.j-svg text { font-family: var(--hand); fill: var(--ink); }
.j-svg .pen { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
.j-svg .pcl { fill: none; stroke: var(--pencil); stroke-linecap: round; stroke-linejoin: round; }

/* doodles sketch themselves in when the camera first reaches them */
.dd .dw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .9s cubic-bezier(.5,0,.2,1) var(--d, 0s); }
.dd .fl { opacity: 0; transition: opacity .8s ease calc(var(--d, 0s) + .35s); }
.dd.on .dw { stroke-dashoffset: 0; }
.dd.on .fl { opacity: 1; }

.smoke { animation: smoke 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
@keyframes smoke { 50% { transform: translate(2px, -3px) scale(1.08); opacity: .55; } }
.ripple { animation: ripple 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ripple { 50% { transform: scale(1.18); opacity: .35; } }
.puff-breathe { animation: breathe 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes breathe { 50% { transform: scale(1.05) translateX(4px); } }
.flag { animation: flag 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
@keyframes flag { 50% { transform: scaleX(.82) skewY(-6deg); } }
.flapw { animation: flapw .5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flapw { 50% { transform: scaleY(.45); } }
.drop { stroke: var(--rain); stroke-width: 1.3; stroke-linecap: round; fill: none; opacity: .75; animation: fall 1s linear infinite; }
@keyframes fall { 0% { transform: translate(0, -6px); opacity: 0; } 15% { opacity: .85; } 85% { opacity: .85; } 100% { transform: translate(-9px, 46px); opacity: 0; } }
.splash { fill: none; stroke: var(--rain); stroke-width: 1; opacity: 0; animation: splash 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes splash { 0% { transform: scale(.3); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
.shower { animation: drift 22s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
.swim { animation: swim 9s ease-in-out infinite alternate; }
@keyframes swim { from { transform: translateX(calc(-1 * var(--sw, 8px))); } to { transform: translateX(var(--sw, 8px)); } }
.graze { animation: graze 5s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
@keyframes graze { 0%, 55%, 100% { transform: none; } 65%, 90% { transform: translateY(2.5px) rotate(18deg); } }
.hop { animation: hop 3.2s ease-in-out infinite; }
@keyframes hop { 0%, 70%, 100% { transform: none; } 78% { transform: translate(2px, -6px); } 86% { transform: translate(4px, 0); } 92% { transform: translate(5px, -3px); } }
.flame { animation: flame .9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom center; }
@keyframes flame { from { transform: scale(.85, .8) skewX(-6deg); } to { transform: scale(1.08, 1.15) skewX(5deg); } }
.zz { animation: zz 3.4s ease-in-out infinite; }
@keyframes zz { 0% { transform: translate(0, 4px); opacity: 0; } 30%, 70% { opacity: .9; } 100% { transform: translate(8px, -10px); opacity: 0; } }
.pulse-ring { animation: pring 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }

.stop { cursor: pointer; outline: none; }
.stop .lbl { transition: transform .35s cubic-bezier(.2,.8,.2,1); transform-box: fill-box; transform-origin: center; }
.stop.near .lbl, .stop:hover .lbl, .stop:focus-visible .lbl { transform: scale(1.1); }
.stop .uline { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .5s ease; }
.stop.near .uline, .stop:hover .uline, .stop:focus-visible .uline { stroke-dashoffset: 0; }
.stop:focus-visible .ring { stroke-width: 3.4; }

/* HUD */
.j-hud { position: absolute; z-index: 3; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.j-hud > * { pointer-events: auto; }
.j-title { font-family: var(--hand); line-height: .95; text-shadow: 0 0 4px var(--paper), 0 0 10px var(--paper), 0 0 16px var(--paper); }
.j-title b { display: block; font-size: clamp(30px, 4.4vw, 46px); font-weight: 600; letter-spacing: -.01em; }
.j-title span { display: block; font-size: 19px; color: var(--pencil); margin-top: 4px; }
.j-date { display: inline-block; margin-top: 10px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink);
  background: var(--paper); padding: 4px 9px; border: 1.5px solid var(--ink); border-radius: 255px 12px 225px 12px / 12px 225px 12px 255px; font-variant-numeric: tabular-nums; }
.j-ctl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.hbtn { font-family: var(--hand); font-size: 20px; line-height: 1; color: var(--ink); background: var(--paper); cursor: pointer; padding: 6px 12px 7px;
  border: 1.8px solid var(--ink); border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; box-shadow: 2px 3px 0 var(--ink);
  transition: transform .15s ease, box-shadow .15s ease; white-space: nowrap; }
.hbtn:hover { transform: translate(-1px, -1px) rotate(-1deg); box-shadow: 3px 4px 0 var(--ink); }
.hbtn:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--ink); }
.hbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.hbtn:focus-visible { outline: 2px dashed var(--car); outline-offset: 3px; }
.hseg { display: inline-flex; }
.hseg .hbtn { box-shadow: none; padding-inline: 9px; }
.hseg .hbtn:first-child { border-right-width: .9px; border-radius: 255px 4px 4px 15px / 15px 4px 4px 255px; }
.hseg .hbtn:last-child { border-left-width: .9px; border-radius: 4px 15px 225px 4px / 4px 225px 15px 4px; }
.hseg .hbtn:hover { transform: none; }

.j-foot { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.j-foot > * { pointer-events: auto; }
.j-arrive { font-family: var(--hand); font-size: 22px; color: var(--ink); background: var(--paper); cursor: pointer;
  border: 1.8px solid var(--ink); border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px; padding: 5px 16px 6px; box-shadow: 2px 3px 0 var(--car);
  transition: opacity .3s ease, transform .3s cubic-bezier(.2,.8,.2,1); }
.j-arrive[data-show="false"] { opacity: 0; transform: translateY(10px) rotate(-2deg); pointer-events: none; }
.j-arrive em { font-style: normal; color: var(--car); }
.j-strip { width: min(560px, 100%); height: 40px; display: block; overflow: visible; }
.j-strip .tick { cursor: pointer; }
.j-strip text { font-family: var(--hand); font-size: 15px; fill: var(--pencil); }
.j-hint { font-family: var(--hand); font-size: 18px; color: var(--pencil); transition: opacity .6s; text-shadow: 0 0 6px var(--paper); }

/* notes sheet */
.j-note { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(78px + env(safe-area-inset-top, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100vw - 32px)); overflow: auto; overscroll-behavior: contain; background: var(--paper); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 18px 255px 15px 225px / 225px 15px 255px 18px; box-shadow: 5px 6px 0 var(--ink);
  padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 14px; }
.j-note .k { font-family: var(--hand); font-size: 20px; color: var(--pencil); }
.j-note h2 { font-family: var(--hand); font-weight: 600; font-size: 40px; line-height: .95; margin: 0; text-wrap: balance; padding-right: 36px; }
.j-note .when { font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--pencil); font-variant-numeric: tabular-nums; }
.j-note .when b { color: var(--car); font-weight: 500; }
.j-note .md { font-size: 15px; line-height: 1.6; max-width: 62ch; }
.j-note .md h2 { font-family: var(--hand); font-size: 27px; font-weight: 600; line-height: 1; margin: 16px 0 6px; padding: 0; text-transform: none; letter-spacing: 0; color: var(--ink); }
.j-note .md em { color: var(--pencil); }
.j-note .md p { margin: 0 0 10px; }
.j-note .md a, .j-note .refs a { color: inherit; text-decoration-color: var(--car); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.j-note .sec { font-family: var(--hand); font-size: 24px; font-weight: 600; margin: 4px 0 -4px; }
.j-note .refs { margin: 0; padding-left: 18px; font-size: 14.5px; line-height: 1.55; display: flex; flex-direction: column; gap: 4px; }
.j-note .x { position: absolute; top: 14px; right: 16px; width: 36px; height: 36px; border: 0; background: none; cursor: pointer; color: var(--ink); padding: 0; }
.j-note .x svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.j-note .x:focus-visible { outline: 2px dashed var(--car); border-radius: 8px; }
@media (max-width: 640px) {
  .j-note { top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; max-height: 74dvh; border-radius: 20px 225px 6px 6px / 120px 15px 6px 6px; }
  .j-hint { display: none; }
  .j-date { margin-top: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .dd .dw { stroke-dashoffset: 0 !important; transition: none !important; }
  .dd .fl { opacity: 1 !important; transition: none !important; }
}
</style>

<script>
(() => {
const JT = {
  pt: {
    h: "Estrada de estudos", sub: "diário de engenharia", now: "Hoje",
    hint: "role para trás e veja a história, para frente e veja o que vem", soon: "em breve", building: "em construção", fog: "a estrada continua...",
    days: n => n === 1 ? "1 dia" : `${n} dias`, day: n => `dia ${n}`, since: "desde", today: "hoje", next: "próximo",
    inProgress: "em andamento", started: "começou", openNotes: "ver notas", arrive: "Você está em",
    refs: "Referências", onMap: "No roadmap", close: "Fechar", noNotes: "Ainda sem notas.", gap: n => `${n} dias depois`, idle: "pausa", idleDays: n => `pausa · ${n === 1 ? "1 dia" : n + " dias"}`,
    kinds: { book: "livro", video: "vídeos", article: "artigo", guide: "guia", course: "curso", project: "projeto", talk: "palestra" },
    months: ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"]
  },
  en: {
    h: "Study road", sub: "engineering log", now: "Today",
    hint: "scroll back for the history, forward for what's next", soon: "coming up", building: "under construction", fog: "the road goes on...",
    days: n => n === 1 ? "1 day" : `${n} days`, day: n => `day ${n}`, since: "since", today: "today", next: "next",
    inProgress: "in progress", started: "started", openNotes: "open notes", arrive: "You're at",
    refs: "References", onMap: "On the roadmap", close: "Close", noNotes: "No notes yet.", gap: n => `${n} days later`, idle: "break", idleDays: n => `break · ${n === 1 ? "1 day" : n + " days"}`,
    kinds: { book: "book", video: "videos", article: "article", guide: "guide", course: "course", project: "project", talk: "talk" },
    months: ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]
  }
};
let lang = null;
const L = () => lang === "en" ? "en" : "pt";
const T = () => JT[L()];
const NS = "http://www.w3.org/2000/svg";
const RMo = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $j = id => document.getElementById(id);
const escJ = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sget = k => { try { return localStorage.getItem(k); } catch { return null; } };
const sset = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
lang = sget("rm-lang") || ((navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en");

/* ---------- tiny drawing kit ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(7);
const J = (k = 1) => (R() - .5) * 2 * k;
const f1 = n => Math.round(n * 10) / 10;
function wob(pts, j = 1.2, closed = false) {
  const o = pts.map(([x, y]) => [x + J(j), y + J(j)]);
  if (o.length < 3) return `M${f1(o[0][0])} ${f1(o[0][1])}` + o.slice(1).map(p => ` L${f1(p[0])} ${f1(p[1])}`).join("");
  let d = `M${f1(o[0][0])} ${f1(o[0][1])}`;
  for (let i = 1; i < o.length - 1; i++) { const m = [(o[i][0] + o[i + 1][0]) / 2, (o[i][1] + o[i + 1][1]) / 2]; d += ` Q${f1(o[i][0])} ${f1(o[i][1])} ${f1(m[0])} ${f1(m[1])}`; }
  const e = o[o.length - 1]; d += ` L${f1(e[0])} ${f1(e[1])}`;
  return closed ? d + " Z" : d;
}
function seg(pts, j = .9) { const o = pts.map(([x, y]) => [x + J(j), y + J(j)]); return "M" + o.map(p => `${f1(p[0])} ${f1(p[1])}`).join(" L"); }
function ring(rx, ry = rx, j = 1.2, turns = 1.07, n = 0) {
  n = n || Math.max(10, Math.round(rx / 2.2)); const s0 = R() * 6.28, p = [];
  for (let i = 0; i <= n * turns; i++) { const a = s0 + i / n * 6.283; p.push([Math.cos(a) * (rx + J(j)), Math.sin(a) * (ry + J(j))]); }
  return p;
}
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const line = (g, d, cls = "pen", w = 1.5, extra = {}) => el("path", { d, class: cls, "stroke-width": w, ...extra }, g);
const dw = (g, d, cls = "pen", w = 1.4) => el("path", { d, class: "dw " + cls, "stroke-width": w, pathLength: 1 }, g);
const fl = (g, d, fill) => el("path", { d, class: "fl", fill, stroke: "none" }, g);

/* ---------- time ---------- */
const DAY = 864e5;
const dnum = s => { const [y, m, d] = String(s).split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };
const nowD = new Date();
const TODAY = Math.round(Date.UTC(nowD.getFullYear(), nowD.getMonth(), nowD.getDate()) / DAY);
const fmtD = (dn, year) => { const d = new Date(dn * DAY); return `${d.getUTCDate()} ${T().months[d.getUTCMonth()]}${year ? " " + d.getUTCFullYear() : ""}`; };

/* ---------- model: stops spaced by real days ---------- */
const PX_DAY = 30, MIN_GAP = 220, PLAN_GAP = 300, LEAD = 300, CAR0 = 70, STEP = 6, W = 16, CH = 50;
let M = null;
function buildModel() {
  const log = Array.isArray(DATA.log) ? DATA.log : [];
  const dated = log.filter(e => e.started).map(e => ({ e, day: dnum(e.started) })).sort((a, b) => a.day - b.day);
  const planned = log.filter(e => !e.started).map(e => ({ e }));
  const stops = []; let s = LEAD, prev = null;
  for (const x of dated) {
    if (prev) s += Math.max(MIN_GAP, (x.day - prev.day) * PX_DAY);
    x.s = s; x.gap = prev ? x.day - prev.day : null;
    x.state = x.e.status === "done" ? "done" : x.day > TODAY ? "next" : "cur";
    stops.push(x); prev = x;
  }
  const anchors = dated.map(x => [x.day, x.s]);
  const dayToS = day => {
    if (!anchors.length) return LEAD;
    if (day <= anchors[0][0]) return anchors[0][1] + (day - anchors[0][0]) * PX_DAY;
    for (let i = 1; i < anchors.length; i++) if (day <= anchors[i][0]) {
      const [d0, s0] = anchors[i - 1], [d1, s1] = anchors[i]; return s0 + (s1 - s0) * (day - d0) / Math.max(1, d1 - d0);
    }
    const [dl, sl] = anchors[anchors.length - 1]; return sl + (day - dl) * PX_DAY;
  };

function drawScenery() {

    for (let a = -c; a <= c; a++) for (let b = -c; b <= c; b++) occ.add((gx + a) + "," + (gy + b)); return true; };

  }

}

const journey = () => $j("journey");

}
let JTOP = 0;
const jTop = () => JTOP;

function reveal() {

}
let lastHud = "";
